{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "smb-test-server.serviceAccountName" . }}
  labels:
    {{- include "smb-test-server.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# smbd never talks to the API server, so it gets no token.
automountServiceAccountToken: false
{{- end }}
