apiVersion: v1
kind: Service
metadata:
  name: {{ include "smb-test-server.fullname" . }}
  labels:
    {{- include "smb-test-server.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if and (eq .Values.service.type "LoadBalancer") .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  ports:
    - name: smb
      port: {{ .Values.service.port }}
      # Named target, so changing smb.port needs no change here.
      targetPort: smb
      protocol: TCP
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "smb-test-server.selectorLabels" . | nindent 4 }}
