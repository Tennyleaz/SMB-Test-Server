{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "smb-test-server.fullname" . }}
  labels:
    {{- include "smb-test-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Base64 in a Secret is encoding, not encryption - anyone with get access to
  # this namespace can read it back. That is acceptable for a throwaway test
  # fixture with a throwaway password. For anything else, set
  # auth.existingSecret and manage the Secret out of band.
  smb-password: {{ .Values.auth.password | quote }}
{{- end }}
