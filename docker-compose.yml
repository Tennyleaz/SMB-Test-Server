services:
  smb-test:
    build:
      context: .
      # See the ARG block in the Dockerfile for what these control. Change one
      # and rebuild with `docker compose build` for it to take effect.
      args:
        FIXTURE_LARGE_MB: "${FIXTURE_LARGE_MB:-10}"
        FIXTURE_SPARSE_MB: "${FIXTURE_SPARSE_MB:-0}"
        FIXTURE_MANY_FILES: "${FIXTURE_MANY_FILES:-256}"
        FIXTURE_DEEP_LEVELS: "${FIXTURE_DEEP_LEVELS:-20}"
        FIXTURE_HOSTILE_NAMES: "${FIXTURE_HOSTILE_NAMES:-0}"
    image: smb-test-server:local
    container_name: smb-test

    # Values come from .env if present, otherwise these defaults apply.
    environment:
      SMB_USER: "${SMB_USER:-testuser}"
      SMB_PASS: "${SMB_PASS:-testpass}"
      SMB_SHARE: "${SMB_SHARE:-testshare}"
      SMB_PORT: "${SMB_PORT:-445}"
      SMB_UID: "${SMB_UID:-1000}"
      SMB_WORKGROUP: "${SMB_WORKGROUP:-WORKGROUP}"
      SMB_NETBIOS_NAME: "${SMB_NETBIOS_NAME:-SMBTEST}"
      SMB_MIN_PROTOCOL: "${SMB_MIN_PROTOCOL:-SMB2}"
      SMB_MAX_PROTOCOL: "${SMB_MAX_PROTOCOL:-SMB3}"
      SMB_NTLM_AUTH: "${SMB_NTLM_AUTH:-ntlmv2-only}"
      SMB_LOG_LEVEL: "${SMB_LOG_LEVEL:-1}"

    # SMB_HOST_PORT is what clients connect to; SMB_PORT is what smbd listens
    # on inside the container. Set SMB_HOST_PORT=1445 to sidestep a host that
    # already owns 445 (any Windows machine, or a host running Samba).
    ports:
      - "${SMB_HOST_PORT:-445}:${SMB_PORT:-445}/tcp"

    # No volumes. The share contents are baked into the image at /share, so a
    # fresh container always serves the same known file set and there is no
    # host folder to set up, permission-match, or accidentally write to.
    #
    # To serve your own files instead, uncomment this and keep the :ro - it
    # shadows the baked-in /share rather than merging with it:
    # volumes:
    #   - ./my-files:/share:ro

    restart: unless-stopped
